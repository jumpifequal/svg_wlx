; svg_wlx.ini - configuration for the SVG Lister plugin (svg_wlx.wlx / svg_wlx.wlx64)
;
; Place this file in the same folder as svg_wlx.wlx / svg_wlx.wlx64, using
; the same base name (svg_wlx.ini). If the file is missing, or a key below
; is missing or unreadable, the plugin falls back to the default noted for
; that key - this file is entirely optional.
;
; Only the interactive Lister preview is affected by these settings. Total
; Commander's file-list thumbnail preview always flattens transparent SVGs
; onto a solid white background, regardless of what is set here.

[Display]

; Checkerboard=1 shows a light/dark gray checkerboard pattern behind any
; transparent part of an SVG - the same convention most image editors and
; viewers (Photoshop, GIMP, etc.) use to make transparency visible.
; Checkerboard=0 disables it; transparent pixels are then filled with the
; solid color from TransparentBackgroundColor below instead.
; Default: 1
Checkerboard=1

; TransparentBackgroundColor is the solid RGB color (hex, RRGGBB, no "#")
; used to fill transparent pixels when Checkerboard=0 above. Ignored when
; Checkerboard=1.
; Default: FFFFFF (white)
TransparentBackgroundColor=FFFFFF
